databases:
  - name: engtech-db
    plan: basic-256mb
    databaseName: engtech
    user: engtech

services:
  - type: web
    name: engtech-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: engtech-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false